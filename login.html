<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-key="login_doc_title">Connexion – IntelliBuild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<header class="topbar">
 <h2> <div class="logo" data-key="brand"> IntelliBuild</div></h2>
  <a href="p1.html" class="btn outline" data-key="nav_home">Accueil</a>
</header>

<section class="auth-container">
  <div class="auth-box">
    <h2 data-key="login_title">Connexion</h2>
    <p data-key="login_sub">Accédez à votre plateforme de gestion d’objets connectés</p>

    <form>
      <label data-key="label_email">Email</label>
      <input type="email" placeholder="exemple@mail.com" required>

      <label data-key="label_password">Mot de passe</label>
      <input type="password" placeholder="••••••••" required>

      <button class="btn primary big" type="submit" data-key="btn_signin">Se connecter</button>
    </form>
    
    <span class="auth-link" data-html="true" data-key="auth_link_register"></span>
  </div>
</section>

<script src="translations.js"></script>
</body>
</html>
